name: Deploy to env-bolao-prod (ACA Backend)

on:
  push:
    branches:  
      [ master ]    
    paths:
      - 'src/ApostasApp.Core.Web/**' 
      - 'src/ApostasApp.Core.Application/**'
      - 'src/ApostasApp.Core.Domain/**'
      - 'src/ApostasApp.Core.Infrastructure/**'
      - 'Dockerfile'
      - '.github/workflows/aca-bolao-api-v1-AutoDeployTrigger-fdc66fde-00ce-4928-b72c-c42dc9a02fc9.yml'

  workflow_dispatch:
    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.ACABOLAOAPIV1_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry and deploy to ACA
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }} 
          dockerfilePath: 'Dockerfile' 
          registryUrl: acabolaoitems.azurecr.io
          registryUsername: ${{ secrets.ACABOLAOAPIV1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ACABOLAOAPIV1_REGISTRY_PASSWORD }}
          imageToBuild: acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}

          containerAppName: env-bolao-prod 
          resourceGroup: rg-bolao-aca-prod
          containerName: bolao-api-backend 
          targetPort: 8080

Se o seu deploy falhar novamente com o erro `Unrecognized command or argument 'process'`, **não é um problema de YAML, mas sim um problema de credenciais (Service Principal) expiradas ou incorretas no Azure que a ação de build está usando.** Nesse caso, o próximo passo será renovar o `Service Principal` e as *secrets* do GitHub.

Por favor, tente o *push* com o código fornecido e me diga o que o log do GitHub Actions mostra!
