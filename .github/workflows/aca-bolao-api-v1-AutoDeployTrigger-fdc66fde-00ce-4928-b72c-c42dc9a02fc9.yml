name: Deploy to env-bolao-prod (ACA Backend)

on:
  push:
    branches:  
      [ master ]    
    paths:
      - 'src/ApostasApp.Core.Web/**' 
      - 'src/ApostasApp.Core.Application/**'
      - 'src/ApostasApp.Core.Domain/**'
      - 'src/ApostasApp.Core.Infrastructure/**'
      - 'Dockerfile'
      - '.github/workflows/aca-bolao-api-v1-AutoDeployTrigger-fdc66fde-00ce-4928-b72c-c42dc9a02fc9.yml'

  workflow_dispatch:
    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          # Desmembrando o JSON do secret ACABOLAOAPIV1_AZURE_CREDENTIALS
          # Valores usados para login explícito:
          client-id: 9d57c7e4-2b3d-4d87-89e1-cc03b20969f9
          tenant-id: 9e5f2546-7e05-42b7-9c11-aab56c42b631
          subscription-id: 9cdc0b73-fe9b-4ad5-bdbe-88061cf97f60
          service-principal-password: G3o8Q~vow_V-PRM0IK6k4D3.BjY.Bd7hcysX5brd

      - name: Build and push container image to registry and deploy to ACA
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }} 
          dockerfilePath: 'Dockerfile' 
          registryUrl: acabolaoitems.azurecr.io
          registryUsername: ${{ secrets.ACABOLAOAPIV1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ACABOLAOAPIV1_REGISTRY_PASSWORD }}
          imageToBuild: acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}

          containerAppName: env-bolao-prod 
          resourceGroup: rg-bolao-aca-prod
          containerName: bolao-api-backend 
          targetPort: 8080


