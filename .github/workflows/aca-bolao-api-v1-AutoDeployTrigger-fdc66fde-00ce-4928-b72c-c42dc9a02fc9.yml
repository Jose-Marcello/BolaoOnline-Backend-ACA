name: Deploy to env-bolao-qa (ACA Backend)

on:
  push:
    branches:
      - master
    paths:
      - 'src/ApostasApp.Core.Web/**'
      - 'Dockerfile'
      - '.github/workflows/aca-bolao-api-v1-AutoDeployTrigger-fdc66fde-00ce-4928-b72c-c42dc9a02fc9.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      # 1. LOGIN NO AZURE (Versão Padrão, mas confiável, sem comandos manuais)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_QA }}
          # Especificar o ambiente aqui é o ponto de controle mais limpo
          environment: 'AzureCloud' 

      # 2. LOGIN NO ACR
      - name: ACR Login
        uses: azure/docker-login@v1
        with:
          login-server: acabolaoitems.azurecr.io
          username: ${{ secrets.ACABOLAOAPIV1_REGISTRY_USERNAME }}
          password: ${{ secrets.ACABOLAOAPIV1_REGISTRY_PASSWORD }}

      # 3. BUILD E PUSH MANUAL (O Dockerfile corrigido resolve os warnings aqui)
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}"
          docker build . --file Dockerfile --tag $IMAGE_NAME
          docker push $IMAGE_NAME

      # 4. DEPLOY MANUAL NO CONTAINER APPS (Corrigido para usar a subscrição)
      - name: Deploy to Azure Container Apps (QA)
        uses: azure/cli@v1
        with:
          inlineScript: |
            # Corrigido: Não precisa do 'az account set' se a credencial de login for correta.
            # No entanto, se o az/login falhou em setar o contexto, vamos forçar apenas a subscrição:
            az account set --subscription "9fdc0b73-fefb-4ad5-bdbe-88061dc97f60"
            
            IMAGE_NAME="acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}"

            # Atualiza o Container App (ACA)
            az containerapp update --name env-bolao-qa --resource-group rg-bolao-aca-prod --image $IMAGE_NAME
