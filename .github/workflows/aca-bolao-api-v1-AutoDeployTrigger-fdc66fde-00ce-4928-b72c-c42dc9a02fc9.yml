name: Deploy to env-bolao-qa (ACA Backend)

on:
  push:
    branches:
      - master
    paths:
      - 'src/ApostasApp.Core.Web/**'
      - 'Dockerfile'
      - '.github/workflows/aca-bolao-api-v1-AutoDeployTrigger-fdc66fde-00ce-4928-b72c-c42dc9a02fc9.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      # 1. LOGIN NO AZURE (Versão Padrão e Robusta: DEVE FUNCIONAR)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_QA }}
          # Garantir que a credencial seja setada no contexto do ambiente.
          # O problema era que o AZ CLI estava limpando o contexto após a ação.
          
      # 2. LOGIN NO ACR
      - name: ACR Login
        uses: azure/docker-login@v1
        with:
          login-server: acabolaoitems.azurecr.io
          username: ${{ secrets.ACABOLAOAPIV1_REGISTRY_USERNAME }}
          password: ${{ secrets.ACABOLAOAPIV1_REGISTRY_PASSWORD }}

      # 3. BUILD E PUSH MANUAL
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}"
          docker build . --file Dockerfile --tag $IMAGE_NAME
          docker push $IMAGE_NAME

      # 4. DEPLOY MANUAL NO CONTAINER APPS (FORÇANDO A SUBSCRIPTION ID)
      - name: Deploy to Azure Container Apps (QA)
        uses: azure/cli@v1
        with:
          inlineScript: |
            # Ação única e crucial: Forçar a subscrição após o login na etapa 1.
            # O erro de "Cloud" é uma falha de contexto que esta linha deve resolver.
            az account set --subscription "9cdc0b73-fe9b-4ad5-bdbe-88061cf97f60"
            
            IMAGE_NAME="acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}"

            # Atualiza o Container App (ACA)
            az containerapp update --name env-bolao-qa --resource-group rg-bolao-aca-prod --image $IMAGE_NAME

