# ARQUIVO: .github/workflows/aca-bolao-api-v1-AutoDeployTrigger-*.yml

name: Deploy to env-bolao-qa (ACA Backend)

on:
  push:
    branches:  
      [ master ]    
    paths:
      - 'src/ApostasApp.Core.Web/**' 
      - 'Dockerfile'
      - '.github/workflows/aca-bolao-api-v1-AutoDeployTrigger-fdc66fde-00ce-4928-b72c-c42dc9a02fc9.yml'

  workflow_dispatch:
    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      # 1. LOGIN NO AZURE (Usando novo Secret de QA)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_QA }}

      # 2. LOGIN NO ACR
      - name: ACR Login
        uses: azure/docker-login@v1
        with:
          login-server: acabolaoitems.azurecr.io
          username: ${{ secrets.ACABOLAOAPIV1_REGISTRY_USERNAME }}
          password: ${{ secrets.ACABOLAOAPIV1_REGISTRY_PASSWORD }}

      # 3. BUILD E PUSH MANUAL 
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}"
          
          # COMANDO BUILD DOCKER (Contorna o erro de compilação)
          docker build . \
            --file Dockerfile \
            --tag $IMAGE_NAME
            
          docker push $IMAGE_NAME

      # 4. DEPLOY MANUAL (Para o novo ambiente de QA)
      - name: Deploy to Azure Container Apps (QA)
        uses: azure/cli@v1
        with:
          inlineScript: |
            IMAGE_NAME="acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}"
            
            # Comando de update da ACA com a nova imagem
            az containerapp update \
              --name env-bolao-qa \
              --resource-group rg-bolao-qa \
              --image $IMAGE_NAME \              
              --port 8080
