name: Deploy to env-bolao-prod (ACA Backend)

on:
  push:
    branches:  
      [ master ]    
    paths:
      # Paths para acionar o deploy apenas quando o código C# for alterado
      - 'src/ApostasApp.Core.Web/**' 
      - 'src/ApostasApp.Core.Application/**'
      - 'src/ApostasApp.Core.Domain/**'
      - 'src/ApostasApp.Core.Infrastructure/**'
      - 'Dockerfile'
      - '.github/workflows/aca-bolao-api-v1-AutoDeployTrigger-fdc66fde-00ce-4928-b72c-c42dc9a02fc9.yml'

  workflow_dispatch:
    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          # *******************************************************
          # MODO ESTÁVEL: Usa o JSON do Secret (creds) e força o ID da assinatura.
          # O bloco 'creds' deve ser usado para login com Service Principal/senha.
          # *******************************************************
          creds: ${{ secrets.ACABOLAOAPIV1_AZURE_CREDENTIALS }}
          subscription-id: 9cdc0b73-fe9b-4ad5-bdbe-88061cf97f60 # ID da Assinatura para evitar o erro 'No subscriptions found'

      - name: Build and push container image to registry and deploy to ACA
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }} 
          dockerfilePath: 'Dockerfile' 
          registryUrl: acabolaoitems.azurecr.io
          registryUsername: ${{ secrets.ACABOLAOAPIV1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ACABOLAOAPIV1_REGISTRY_PASSWORD }}
          imageToBuild: acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}

          containerAppName: env-bolao-prod 
          resourceGroup: rg-bolao-aca-prod
          containerName: bolao-api-backend 
          targetPort: 8080
