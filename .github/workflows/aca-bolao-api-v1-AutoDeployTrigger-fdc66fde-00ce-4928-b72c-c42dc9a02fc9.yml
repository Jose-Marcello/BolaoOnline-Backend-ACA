name: Deploy to env-bolao-prod (ACA Backend)

on:
  push:
    branches:  
      [ master ]    
    paths:
      # Sugestão: Limitar o gatilho à pasta que contém o código C#
      - 'src/ApostasApp.Core.Api/**' # <-- AJUSTE ESTE PATH PARA ONDE ESTÁ SEU PROJETO C#
      - '.github/workflows/aca-bolao-api-v1-AutoDeployTrigger-fdc66fde-00ce-4928-b72c-c42dc9a02fc9.yml'

  workflow_dispatch:
    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.ACABOLAOAPIV1_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry and deploy to ACA
        uses: azure/container-apps-deploy-action@v2
        with:
          # --- Configuração de Build ---
          appSourcePath: ${{ github.workspace }}/src/ApostasApp.Core.Api # <-- AJUSTE ESTE PATH PARA A RAIZ DO SEU PROJETO C#
          dockerfilePath: 'Dockerfile' # << Assume que o Dockerfile está dentro do appSourcePath
          
          # --- Configuração de Registry (ACR) ---
          registryUrl: acabolaoitems.azurecr.io
          registryUsername: ${{ secrets.ACABOLAOAPIV1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ACABOLAOAPIV1_REGISTRY_PASSWORD }}
          imageToBuild: acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}

          # --- Configuração de Deploy (ACA) ---
          containerAppName: env-bolao-prod 
          resourceGroup: rg-bolao-aca-prod
          containerName: bolao-api-backend # Nome do contêiner dentro da revisão do ACA
          targetPort: 5288 # Se você não especificou esta porta, verifique qual porta o ASP.NET Core está usando (default é 8080/80)
