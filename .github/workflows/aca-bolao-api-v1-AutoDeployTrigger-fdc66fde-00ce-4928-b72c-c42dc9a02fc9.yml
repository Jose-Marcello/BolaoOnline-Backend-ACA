# O SEU NOVO YAML (Atenção à mudança nas etapas de login/deploy)

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      # REMOVA A ETAPA 'AZURE LOGIN' (NÃO VAMOS MAIS USAR A ACTION PADRÃO)

      # 1. LOGIN NO ACR (Continua igual)
      - name: ACR Login
        uses: azure/docker-login@v1
        with:
          # ... (Seus segredos)
          
      # 2. BUILD E PUSH MANUAL (Continua igual)
      - name: Build and Push Docker Image
        # ... (Seu run command)

      # 3. DEPLOY MANUAL NO CONTAINER APPS (AGORA COM LOGIN EMBUTIDO)
      - name: Deploy to Azure Container Apps (QA)
        uses: azure/cli@v1
        with:
          inlineScript: |
            # --- 1. LOGIN MANUAL FORÇADO ---
            # CORREÇÃO CRÍTICA: Faz o login manual com o JSON da Service Principal e Cloud
            # Assume que a credencial é um JSON no formato de Service Principal (appId, password, tenant)
            SPN_JSON='${{ secrets.AZURE_CREDENTIALS_QA }}'
            
            # Use jq para extrair credenciais do JSON. (Se o ambiente Docker tiver jq instalado)
            # Como a ação 'azure/cli@v1' está em um contêiner Docker, o 'jq' deve funcionar.
            APP_ID=$(echo $SPN_JSON | jq -r .clientId)
            PASSWORD=$(echo $SPN_JSON | jq -r .clientSecret)
            TENANT_ID=$(echo $SPN_JSON | jq -r .tenantId)

            # COMANDO DE LOGIN AZ LOGIN EXPLÍCITO NO CLOUD CORRETO
            az login --service-principal -u $APP_ID -p $PASSWORD --tenant $TENANT_ID --cloud AzureCloud
            
            # --- 2. COMANDOS DE DEPLOY ---
            az account set --subscription "9fdc0b73-fefb-4ad5-bdbe-88061dc97f60"
            
            IMAGE_NAME="acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}"

            az containerapp update --name env-bolao-qa --resource-group rg-bolao-aca-prod --image $IMAGE_NAME
