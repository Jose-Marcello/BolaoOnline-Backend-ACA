name: Deploy to env-bolao-qa (ACA Backend)

on:
  push:
    branches:
      - master
    paths:
      - 'src/ApostasApp.Core.Web/**'
      - 'Dockerfile'
      - '.github/workflows/aca-bolao-api-v1-AutoDeployTrigger-fdc66fde-00ce-4928-b72c-c42dc9a02fc9.yml'

  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      # 1. LOGIN NO AZURE (Usa o novo JSON perfeitamente formatado)
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_QA }}
          # Não precisa forçar o ambiente, pois o novo JSON já o contém.

      # 2. LOGIN NO ACR
      - name: ACR Login
        uses: azure/docker-login@v1
        with:
          login-server: acabolaoitems.azurecr.io
          username: ${{ secrets.ACABOLAOAPIV1_REGISTRY_USERNAME }}
          password: ${{ secrets.ACABOLAOAPIV1_REGISTRY_PASSWORD }}

      # 3. BUILD E PUSH MANUAL (Comandos que resolvem os warnings do Dockerfile)
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}"
          
          # COMANDO BUILD DOCKER (Usa o Dockerfile corrigido)
          docker build . --file Dockerfile --tag $IMAGE_NAME
            
          docker push $IMAGE_NAME

      # 4. DEPLOY MANUAL NO CONTAINER APPS (AGORA COM A SUBSCRIPTION ID CORRETA)
      - name: Deploy to Azure Container Apps (QA)
        uses: azure/cli@v1
        with:
          inlineScript: |
            # Ação crucial: Forçar a Subscrição com a ID CORRETA (9cdc...)
            az account set --subscription "9cdc0b73-fe9b-4ad5-bdbe-88061cf97f60"
            
            IMAGE_NAME="acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}"

            # Atualiza o Container App (ACA)
            az containerapp update --name env-bolao-qa --resource-group rg-bolao-aca-prod --image $IMAGE_NAME
