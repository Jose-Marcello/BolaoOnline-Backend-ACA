name: Deploy to env-bolao-prod (ACA Backend)

on:
  push:
    branches:  
      [ master ]    
    paths:
      # Paths para acionar o deploy apenas quando o código C# for alterado
      - 'src/ApostasApp.Core.Web/**' 
      - 'src/ApostasApp.Core.Application/**'
      - 'src/ApostasApp.Core.Domain/**'
      - 'src/ApostasApp.Core.Infrastructure/**'
      - 'Dockerfile'
      - '.github/workflows/aca-bolao-api-v1-AutoDeployTrigger-fdc66fde-00ce-4928-b72c-c42dc9a02fc9.yml'

  workflow_dispatch:
    
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    # **********************************************
    # 1. CORREÇÃO DE PERMISSÃO GLOBAL (Nível do Job)
    # Isso resolve o erro 'Failed to fetch federated token'
    # **********************************************
    permissions:
      id-token: write # Permissão necessária para o Azure Login funcionar corretamente
      contents: read 
    
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          # **********************************************
          # 2. CORREÇÃO DE SINTAXE E FORÇANDO O MÉTODO SP (Senha)
          # A Action tentava forçar OIDC, ignorando sua senha
          # **********************************************
          auth-type: service_principal # Garante que o método SP seja usado
          enable-oicd: false           # Bloqueia a tentativa de OIDC/token
          
          client-id: 9d57c7e4-2b3d-4d87-89e1-cc03b20969f9
          tenant-id: 9e5f2546-7e05-42b7-9c11-aab56c42b631
          subscription-id: 9cdc0b73-fe9b-4ad5-bdbe-88061cf97f60
          client-secret: G3o8Q~vow_V-PRM0IK6k4D3.BjY.Bd7hcysX5brd # Sua nova senha literal

      - name: Build and push container image to registry and deploy to ACA
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }} 
          dockerfilePath: 'Dockerfile' 
          registryUrl: acabolaoitems.azurecr.io
          registryUsername: ${{ secrets.ACABOLAOAPIV1_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.ACABOLAOAPIV1_REGISTRY_PASSWORD }}
          imageToBuild: acabolaoitems.azurecr.io/aca-bolao-api-v1:${{ github.sha }}

          containerAppName: env-bolao-prod 
          resourceGroup: rg-bolao-aca-prod
          containerName: bolao-api-backend 
          targetPort: 8080
